# Thin caller: the logic lives in visionEAE/workflows. run-type: job — the rollout updates the
# job definition and executes it once as its smoke test.
name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for the manual deployment (optional)
        required: false
        default: Manual trigger from GitHub UI

concurrency:
  group: deploy-s360-relay
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: visionEAE/workflows/.github/workflows/java-ci.yml@main

  deploy:
    needs: ci
    if: vars.GCP_WIF_PROVIDER != ''
    uses: visionEAE/workflows/.github/workflows/java-deploy.yml@main
    with:
      service: s360-relay
      run-type: job
